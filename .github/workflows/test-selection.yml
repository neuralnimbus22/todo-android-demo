name: Test Selection (manual)

# Starts the per-change test selection flow in Testkube for the branch you pick under
# "Run workflow". CircleCI already starts the same flow on every push to a demo/ branch
# and waits for its result (.circleci/config.yml), so this workflow only runs by hand.
# That way a push starts one AI agent chat, not two.
#
# This job only starts the first Testkube workflow, android-test-selection, for the
# chosen branch. Everything after that runs in Testkube on its own:
#   1. android-test-selection lists the change and traces it to the Espresso test
#      classes that reach it (no AI).
#   2. When it passes, the AI Agent Trigger android-test-selection-trigger starts the
#      android-test-selector agent with that run's ID.
#   3. The agent decides each test class, starts espresso-ui-selected with only the
#      picked classes, and reports in the run's AI chat.
#
# The job needs a TESTKUBE_API_TOKEN secret in this repository. Without it the job
# says so and stops, and nothing else happens.

on:
  workflow_dispatch:

jobs:
  start-test-selection:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.TESTKUBE_API_TOKEN != '' }}
    steps:
      - name: Check for the Testkube token
        if: env.HAS_TOKEN != 'true'
        run: echo "TESTKUBE_API_TOKEN is not set in this repository, so no Testkube run was started."

      - name: Setup Testkube CLI
        if: env.HAS_TOKEN == 'true'
        uses: kubeshop/setup-testkube@v1
        with:
          organization: tkcorg_b5ace2135f138dc8
          environment: tkcenv_362177294460621a
          token: ${{ secrets.TESTKUBE_API_TOKEN }}

      - name: Start android-test-selection for this branch
        if: env.HAS_TOKEN == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Fire and do not watch. The CLI returns once the run is queued, and
          # the trigger takes over from there.
          testkube run testworkflow android-test-selection \
            --config branch="$BRANCH" \
            --tag "commit=${SHA:0:7}"
          echo "Started android-test-selection for $BRANCH."
          echo "Follow it: https://app.testkube.io/organization/tkcorg_b5ace2135f138dc8/environment/tkcenv_362177294460621a/dashboard/test-workflows/android-test-selection"
